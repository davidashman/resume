    executive_bio:
      - |-
        David Ashman is a technology transformation leader who has spent two decades driving large-scale organizational change at the intersection of software, process, and
        culture. From pioneering SaaS migrations and DevOps adoption to leading cloud-native modernization and AI-augmented development, he brings a repeatable playbook for
        guiding companies through technology inflection points — delivering measurable revenue growth, operational efficiency, and market readiness.
      - |-
        As SVP of Engineering at Interfolio (acquired by Elsevier), David tripled the engineering team while holding expenses flat, driving 125% revenue growth and
        expanding the company’s AWS footprint globally. He accelerated deployment velocity by 400% through CI/CD automation, achieved ISO27001 and TX-RAMP certifications,
        and positioned the company for a strategic acquisition.
      - |-
        Previously, as CTO of Teaching Strategies, David reshaped a contractor-heavy team into a high-performing engineering culture, cutting operational costs by 30%, achieving
        SOC2 Type II compliance, and implementing cloud and open-source platforms that scaled with demand. Earlier at Blackboard, he led the SaaS transformation of Blackboard Learn,
        reducing deployment times by 80% and increasing release cadence from biannual to monthly.
      - |-
        David is now focused on the next wave of technology transformation: helping organizations adopt AI to fundamentally reshape how software is built and delivered. Drawing
        on his track record of driving adoption of SaaS, DevOps, and cloud-native technologies, he brings a pragmatic, results-oriented approach to AI adoption — moving
        organizations from experimentation to enterprise-scale implementation. He is a recognized thought leader, featured in The DevOps Handbook and on stage at the CTO Summit
        and DevOps Enterprise Summit.
